[project]
name = "pvpi"
version = "1.1.0"
description = ""
readme = "README.md"
requires-python = ">=3.11"
license = {file = "LICENSE"}
authors = [
  {name = "Luke Ditria"},
  {name = "Matthew Timms", email = "pvpi@timms.dev" },
]
dependencies = [
    "click>=8.3.1",
    "platformdirs>=4.5.1",
    "pydantic>=2.12.5",
    "pydantic-settings>=2.12.0",
    "pyserial>=3.5",
    "pyzmq>=26",
]

[project.optional-dependencies]
bms = ["aiobmsble>=0.32.0; python_version >= '3.12'"]  # a battery BMS read over Bluetooth (pvpi telemetry)
mqtt = ["paho-mqtt>=2.1.0"]  # the readings sent to Home Assistant (pvpi telemetry)

[dependency-groups]
dev = [
    "pytest>=8",
]

[tool.uv]
package = true

[tool.setuptools.package-data]
"pvpi.services" = ["dashboard.html", "schedule.html", "config.html", "dashboard.css", "common.js", "autoecology.png", "pvpi.png"]  # the dashboard's page and logos

[project.scripts]
pvpi = "pvpi.cli:cli"

[tool.ruff]
line-length = 120
[tool.ruff.lint]
extend-select = [
    "B",
    "I",
    "UP",
    "TID",
    "A",
    "SIM",
    "LOG",
    "G"
]
